[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peira-loss"
version = "0.1.0"
description = "PEIRA anti-collapse loss for joint-embedding self-supervised learning (pure PyTorch)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Michael Arbel"},
    {name = "Basile Terver"},
    {name = "Jean Ponce"},
]
dependencies = ["torch>=2.1"]

[project.urls]
Paper = "https://arxiv.org/abs/2605.17671"
Code = "https://github.com/Basile-Terv/PEIRA"
Repository = "https://github.com/MichaelArbel/peira-loss"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
