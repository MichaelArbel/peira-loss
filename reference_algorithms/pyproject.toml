[project]
name = "peira-learning"
version = "0.1.0"
description = "PEIRA and self-distillation algorithms for representation learning"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["torch"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["peira_learning", "peira_learning.*"]
