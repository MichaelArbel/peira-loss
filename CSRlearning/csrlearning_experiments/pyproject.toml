[project]
name = "csrlearning-experiments"
version = "0.1.0"
description = "Experiment runners and analysis for csrlearning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["csrlearning", "torch", "numpy", "mlxp"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["csrlearning_experiments*"]
