seed: 0

# task: 
#   name: "training"
#   epochs: 50
#   steps_per_epoch: 1000    # Number of alternating updates per epoch

task: 
  name: "vectorfield"
  epochs: 50
  steps_per_epoch: 20000    # Number of alternating updates per epoch
  init_seed: 0
  init_scale: 0.0001
  init_mode: "near_zero"


device: "cuda"          # or "cpu"
type: "double"


# Data Generation Parameters
data:
  name: "experiments.data.generator.LinearCCADataGenerator"
  kwargs: 
    d1: 20                 # Dimension of view 1
    d2: 20                 # Dimension of view 2
    k: 10                   # Ground truth latent dimension
    sigma: 0.1              # Noise level epsilon
    batch_size: 512
    deterministic: True
    sign_flip: False


# SCEgrad Hyperparameters

optimizer:
  name: "torch.optim.SGD"
  kwargs: { lr: 1.0 }

scheduler:
  name: "torch.optim.lr_scheduler.CosineAnnealingLR"
  kwargs: { T_max: 20000, eta_min: 0.000001 }

algorithm:
  name: "csrlearning.algorithms.CSEBilevelStoGrad"
  kwargs:
    n_iter: 1
    latent_dim: 30
    reg: 0.1
    symmetric: true
    with_adjoint: true
    lr: 1.0
    T_max: 20000
