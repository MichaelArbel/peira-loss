seed: 0

# task: 
#   name: "training"
#   epochs: 50
#   steps_per_epoch: 1000    # Number of alternating updates per epoch

task: 
  name: "vectorfield"
  epochs: 50
  steps_per_epoch: 20000    # Number of alternating updates per epoch
  init_seed: 0
  init_scale: 0.0001
  init_mode: "near_zero"


device: "cuda"          # or "cpu"
type: "double"


# Data Generation Parameters
data:
  name: "generator.LinearCCADataGenerator"
  kwargs: 
    d1: 20                 # Dimension of view 1
    d2: 20                 # Dimension of view 2
    k: 10                   # Ground truth latent dimension
    sigma: 0.1              # Noise level epsilon
    batch_size: 512
    deterministic: True
    sign_flip: False


# SCEgrad Hyperparameters
learner:
  name: "learners.CSELearningModel"
  kwargs:
    algorithm_name: "algorithm_steps.CanonicalSubspaceEmbeddingBilevelJointAlgorithm"
    latent_dim: 30          # The size of representations u and v
    lr_u: 1.         # Learning rate for U_theta
    lr_v: 0.1           # Learning rate for V_psi
    eta: 1.              # Learning rate for S update (LinPred)
    reg_c: .1              # Regularization constant c
    n_opt_v: 1
    n_opt_pred: 1
    n_accum_pred: 1
    update_mode_cold_start: False
    full_solve_v: True
    params_q: 
      update_rule: "exact_inverse"
      momentum: False
      cold_start: True
      kwargs: null
